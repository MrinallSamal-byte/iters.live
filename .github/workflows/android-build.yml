name: Build Native Android App

on:
  # Trigger on push to main branch or new tags
  push:
    branches: [ main ]
    tags:
      - 'v*'
  # Manual dispatch for on-demand builds
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release with the built APK'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Make gradlew executable
      run: chmod +x ./android-app/gradlew

    - name: Build Android app
      run: npm run build:android -- --release --skip-tests

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ITER-EduHub-APK
        path: releases/android/ITERasn-hub-native-release.apk
        retention-days: 90

    - name: Determine release tag
      id: release_tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          # Use short SHA for more unique versioning
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=v1.0.${{ github.run_number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
        fi

    - name: Check if should create release
      id: should_release
      run: |
        SHOULD_RELEASE="false"
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          SHOULD_RELEASE="true"
        fi
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          SHOULD_RELEASE="true"
        fi
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.create_release }}" == "true" ]]; then
          SHOULD_RELEASE="true"
        fi
        echo "value=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT

    - name: Create Release
      if: steps.should_release.outputs.value == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.release_tag.outputs.tag }}
        name: ITER EduHub ${{ steps.release_tag.outputs.tag }}
        body: |
          ## ITER EduHub Native Android App
          
          **Version**: ${{ steps.release_tag.outputs.tag }}
          **Build**: #${{ github.run_number }}
          
          ### 📱 Features
          - Native Android client built from `android-app/`
          - Intended API-backed student, teacher, and admin flows
          - Kotlin/Gradle build artifact generated from the repository Android module
          - Not a WebView, TWA, or Bubblewrap wrapper
          
          ### 📥 Installation
          1. Download **ITER.apk** below
          2. Enable "Install from Unknown Sources" on your device
             - Go to Settings → Security → Install Unknown Apps
             - Enable for your browser or file manager
          3. Open the downloaded APK file
          4. Tap **Install** when prompted
          5. Open the app and enjoy!
          
          ### 📋 Requirements
          - Android 10 or higher (API 29+)
          - Android package installation enabled on the device
          - Network access to the configured backend/API
          
          ### 🔗 Direct Download
          Click on the attached APK in the Assets section below to download.
        files: releases/android/ITERasn-hub-native-release.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
