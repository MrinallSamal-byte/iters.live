name: Render Keepalive

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 min — well below Render's 15-min free-tier sleep threshold
  workflow_dispatch:

# Prevent multiple simultaneous keepalive pings wasting Action minutes
concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve healthcheck target
        id: target
        env:
          RENDER_HEALTHCHECK_URL: ${{ vars.RENDER_HEALTHCHECK_URL }}
          RENDER_HEALTHCHECK_URL_SECRET: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          TARGET_URL="${RENDER_HEALTHCHECK_URL:-$RENDER_HEALTHCHECK_URL_SECRET}"

          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://iter-aio.onrender.com"
          fi

          case "$TARGET_URL" in
            */health|*/api/health)
              HEALTH_URL="$TARGET_URL"
              ;;
            *)
              HEALTH_URL="${TARGET_URL%/}/health"
              ;;
          esac

          echo "health_url=$HEALTH_URL" >> "$GITHUB_OUTPUT"
          echo "Using keepalive URL: $HEALTH_URL"

      - name: Ping Render health endpoint
        run: |
          HEALTH_URL="${{ steps.target.outputs.health_url }}"

          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 45 \
              --user-agent "iterasn-hub-keepalive" \
              "$HEALTH_URL"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Keepalive attempt $attempt failed. Waiting 45 seconds before retrying..."
              sleep 45
            fi
          done

          echo "::warning::Keepalive ping failed after 3 attempts. If your Render app has a different URL, please set the RENDER_HEALTHCHECK_URL repository variable."
          exit 0
