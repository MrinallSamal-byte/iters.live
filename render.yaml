services:
  - type: web
    name: iter-aio
    env: node
    plan: free
    buildCommand: npm install --omit=optional
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_WHITELIST
        value: https://iter-aio.onrender.com
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PORTAL_FEATURES_ENABLED
        value: "false"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

## Using an existing Render PostgreSQL database as provided. No auto DB provision here.