services:
  - type: web
    name: iter-aio
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 1h
      # Client origin used for links/emails and Socket.IO CORS fallback
      - key: CLIENT_URL
        value: https://iters.live
      - key: SOCKET_CORS_ORIGIN
        value: https://iters.live
      # Optional external Redis (Render Key Value). Leave unset to use in-memory cache.
      - key: REDIS_URL
        sync: false
      - key: CORS_WHITELIST
        value: https://updated-iters-live.onrender.com,https://iters.live
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        value: https://iters.live
      - key: OPENROUTER_SITE_NAME
        value: ITERasn hub
      - key: OPENROUTER_TIMEOUT_MS
        value: "20000"
      - key: OPENROUTER_CHAT_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENROUTER_CHAT_FALLBACK_MODELS
        value: google/gemma-3-27b-it:free,arcee-ai/trinity-large-preview:free,google/gemma-3-12b-it:free,mistralai/mistral-small-3.1-24b-instruct:free,google/gemma-3-4b-it:free
      - key: OPENROUTER_CAPTCHA_MODEL
        value: nvidia/nemotron-nano-12b-v2-vl:free
      - key: OPENROUTER_CAPTCHA_FALLBACK_MODELS
        value: google/gemma-3-27b-it:free,mistralai/mistral-small-3.1-24b-instruct:free,google/gemma-3-12b-it:free,google/gemma-3-4b-it:free
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Enable SOA scraping now that Chromium is installed through Docker.
      - key: PORTAL_FEATURES_ENABLED
        value: "true"
      # Prevent too many concurrent Chromium sessions from exhausting the Render instance.
      - key: SOA_MAX_ACTIVE_SESSIONS
        value: "2"
      # Internal keepalive to reduce free-tier idle sleep
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL_MS
        value: "600000" # 10 min — safely below Render's 15-min sleep threshold
      # Leave enough room for the Playwright browser alongside Node.js.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
    disk:
      name: uploads
      mountPath: /usr/src/app/uploads
      sizeGB: 1

## Using an existing Render PostgreSQL database as provided. No auto DB provision here.
