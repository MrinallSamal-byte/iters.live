services:
  - type: web
    name: iter-aio
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_WHITELIST
        value: https://iter-aio.onrender.com
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Disable portal scraping on Render free tier due to memory limits
      - key: PORTAL_FEATURES_ENABLED
        value: "false"
      # Memory optimization flags
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

## Using an existing Render PostgreSQL database as provided. No auto DB provision here.
