services:
  - type: web
    name: iter-aio
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_WHITELIST
        value: https://iter-aio.onrender.com
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        value: https://iter-aio.onrender.com
      - key: OPENROUTER_SITE_NAME
        value: ITERasn hub
      - key: OPENROUTER_TIMEOUT_MS
        value: "20000"
      - key: OPENROUTER_CHAT_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENROUTER_CHAT_FALLBACK_MODELS
        value: google/gemma-3-27b-it:free,arcee-ai/trinity-large-preview:free,google/gemma-3-12b-it:free,mistralai/mistral-small-3.1-24b-instruct:free,google/gemma-3-4b-it:free
      - key: OPENROUTER_CAPTCHA_MODEL
        value: nvidia/nemotron-nano-12b-v2-vl:free
      - key: OPENROUTER_CAPTCHA_FALLBACK_MODELS
        value: google/gemma-3-27b-it:free,mistralai/mistral-small-3.1-24b-instruct:free,google/gemma-3-12b-it:free,google/gemma-3-4b-it:free
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Disable portal scraping on Render free tier due to memory limits
      - key: PORTAL_FEATURES_ENABLED
        value: "false"
      # Memory optimization flags
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

## Using an existing Render PostgreSQL database as provided. No auto DB provision here.
