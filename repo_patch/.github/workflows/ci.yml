name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Run unit tests and collect code coverage
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: postgres
          POSTGRES_DB: iter_college_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d iter_college_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run unit tests
      run: npm test
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: testpassword
        DB_NAME: iter_college_test
        DB_SSL: 'false'
        JWT_SECRET: test-secret
        JWT_REFRESH_SECRET: test-refresh-secret
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info

  # Build and package the Electron desktop app on Linux and Windows
  build-electron:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build Electron app
      run: npm run build:electron
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: desktop-${{ matrix.os }}
        path: releases/desktop/*

  # Build the native Android application
  build-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    # Create a local.properties file so Gradle knows where the Android SDK lives.
    # Without this file the build will fail quickly because it can't locate the SDK.
    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
    - name: Make gradlew executable
      run: chmod +x ./android-app/gradlew
    - name: Build Android app
      run: npm run build:android
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: releases/android/*.apk

  # Placeholder deployment job – customize to suit your hosting environment
  deploy:
    runs-on: ubuntu-latest
    needs: [build-electron, build-android]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy placeholder
      run: echo "Add your deployment steps here"