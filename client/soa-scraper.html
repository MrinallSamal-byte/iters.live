<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/connect-portal.html">
    <meta name="theme-color" content="#000000">
    <title>SOA Portal Import Moved - ITERasn hub</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --np-bg: var(--r-bg, #000000);
            --np-panel: var(--r-panel, #0a0a0a);
            --np-inset: var(--r-panel-inset, rgba(255, 255, 255, 0.04));
            --np-line: var(--r-line, #1f1f1f);
            --np-line-strong: var(--r-line-strong, #333333);
            --np-text: var(--r-text, #f4f4f4);
            --np-text-2: var(--r-text-2, #b0b0b0);
            --np-text-3: var(--r-text-3, #757575);
            --np-red: var(--r-accent, #d71921);
            --np-red-deep: var(--r-accent-deep, #a31016);
            --np-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
            --np-display: "Doto", "Space Grotesk", sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: var(--np-bg);
            color: var(--np-text-2);
            font-family: "Space Grotesk", "Segoe UI", sans-serif;
        }

        .notice {
            position: relative;
            max-width: 560px;
            width: 100%;
            padding: 2rem;
            border-radius: 0;
            background: var(--np-panel);
            border: 1px solid var(--np-line);
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .notice::before {
            content: "+";
            position: absolute;
            top: 6px;
            right: 10px;
            font-family: var(--np-mono);
            font-size: 0.7rem;
            line-height: 1;
            color: var(--np-line-strong);
        }

        .notice-kicker {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.35rem 0.6rem;
            border: 1px solid rgba(215, 25, 33, 0.45);
            background: rgba(215, 25, 33, 0.08);
            color: var(--np-red);
            font-family: var(--np-mono);
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 0.8rem;
            color: var(--np-text);
            font-family: var(--np-display);
            font-weight: 800;
            font-size: clamp(1.5rem, 4vw, 2rem);
            letter-spacing: 0.01em;
            text-transform: uppercase;
            line-height: 1.05;
        }

        p {
            margin: 0 0 1.2rem;
            color: var(--np-text-2);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .notice-meta {
            padding-top: 1rem;
            border-top: 1px dotted var(--np-line-strong);
            font-family: var(--np-mono);
            font-size: 0.62rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--np-text-3);
            margin: 0;
        }

        a {
            color: var(--np-red);
            text-decoration: none;
            border-bottom: 1px solid var(--np-red);
            font-family: var(--np-mono);
            font-size: inherit;
            transition: color 140ms ease, border-color 140ms ease;
        }

        a:hover {
            color: var(--np-red-deep);
            border-bottom-color: var(--np-red-deep);
        }
    </style>
    <link rel="stylesheet" href="/css/refined-ui.css">
</head>

<body>
    <div class="notice">
        <span class="notice-kicker">Redirect // SOA Scraper</span>
        <h1>SOA portal import moved</h1>
        <p>The old SOA scraper test page has been folded into the main student-facing connection flow. If you are not redirected automatically, open <a href="/connect-portal.html">Connect SOA Portal</a>.</p>
        <p class="notice-meta">/soa-scraper.html &#8250; /connect-portal.html</p>
    </div>
</body>

</html>
