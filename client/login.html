<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>Login - ITER EduHub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/responsive-enhanced.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="/css/responsive-universal.css">
    <link rel="stylesheet" href="/css/button-fixes.css">
    <link rel="stylesheet" href="/css/table-responsive-global.css">
    <link rel="stylesheet" href="/css/login-split.css">
    <link rel="stylesheet" href="/css/chatbot.css">
    <link rel="manifest" href="/manifest.json">
</head>

<body>
    <div class="bg-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="login-container">
        <div class="login-wrapper">
            <!-- Left Side: Branding -->
            <div class="login-brand-section">
                <div class="brand-content">
                    <img class="brand-logo" src="/assets/soa-logo.png" alt="Siksha 'O' Anusandhan University">
                    <h1 class="brand-title">ITER EduHub</h1>
                    <p class="brand-subtitle">Your gateway to academic excellence. Manage attendance, marks, and more in
                        one place.</p>
                </div>
            </div>

            <!-- Right Side: Login Form -->
            <div class="login-form-section">
                <!-- Mobile Header (Visible only on small screens) -->
                <div class="mobile-brand-header">
                    <img class="mobile-brand-logo" src="/assets/soa-logo.png" alt="SOA Logo">
                    <h2 class="mobile-brand-title">ITER EduHub</h2>
                </div>

                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Please login to your account</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="registration_number">Registration Number</label>
                        <input type="text" id="registration_number" name="registration_number"
                            placeholder="e.g. STU20250001" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required
                            autocomplete="current-password">
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember"> Remember me
                        </label>
                        <a href="#forgot-password" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                        Login
                    </button>

                    <div class="divider">
                        <span>OR</span>
                    </div>

                    <button type="button" class="btn btn-secondary btn-block" id="googleLoginBtn"
                        style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"
                            style="width: 18px; height: 18px;">
                        Sign in with Google
                    </button>

                    <div class="error-message" id="errorMessage" style="display: none;"></div>
                </form>

                <div class="demo-hint-compact">
                    <p>🎭 <strong>Quick Demo Access:</strong></p>
                    <div class="demo-chips">
                        <div class="demo-chip" onclick="fillDemo('STU20250001', 'Student@123')">Student</div>
                        <div class="demo-chip" onclick="fillDemo('TCH2025001', 'Teacher@123')">Teacher</div>
                        <div class="demo-chip" onclick="fillDemo('ADM2025001', 'Admin@123456')">Admin</div>
                    </div>
                </div>

                <div class="login-footer">
                    <p>Don't have an account? <a href="/register.html">Register here</a></p>
                    <a href="/index.html" class="back-link">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span class="theme-icon">🌙</span>
    </button>

    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <script src="/js/mobile-fixes.js"></script>
    <script src="/js/prevent-empty-hash.js"></script>
    <script src="/js/scroll-fix.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/mobile-nav.js"></script>
    <script src="/js/url-navigator.js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6I1kc9kJxIzKOOxkS6hDuSNH5ODzDP10",
            authDomain: "iterslive.firebaseapp.com",
            projectId: "iterslive",
            storageBucket: "iterslive.firebasestorage.app",
            messagingSenderId: "121216927952",
            appId: "1:121216927952:web:b33adde62a1c82d91e76d5",
            measurementId: "G-C2E80TXNFP"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Expose auth to window for custom token login
        window.firebaseAuth = auth;
        window.signInWithCustomToken = signInWithCustomToken;

        // Google Login Handler
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        if (googleLoginBtn) {
            googleLoginBtn.addEventListener('click', async () => {
                try {
                    const result = await signInWithPopup(auth, provider);
                    const user = result.user;
                    const idToken = await user.getIdToken();

                    console.log('Google Sign-In successful, verifying with backend...');

                    // Send to backend
                    const response = await APP.API.post('/auth/google-login', { idToken });

                    if (response.success) {
                        // Store user data
                        APP.Storage.set('accessToken', idToken); // Use ID token as access token
                        APP.Storage.set('user', response.data.user);

                        // Redirect
                        const dashboards = {
                            student: '/dashboard/student.html',
                            teacher: '/dashboard/teacher.html',
                            admin: '/dashboard/admin.html'
                        };
                        const redirectUrl = dashboards[response.data.user.role] || '/dashboard/student.html';
                        window.location.href = redirectUrl;
                    } else {
                        alert('Login failed: ' + response.message);
                    }
                } catch (error) {
                    console.error('Google Sign-In Error:', error);
                    alert('Google Sign-In failed. Please try again.');
                }
            });
        }
    </script>

    <script>
        // Wait for DOM and APP to be ready
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');

            // Check if APP is loaded
            if (typeof APP === 'undefined') {
                console.error('APP object not loaded!');
                showError('Application failed to load. Please refresh the page.');
                return;
            }

            console.log('Login form initialized. APP object loaded:', !!APP);

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('Login form submitted');

                const registration_number = document.getElementById('registration_number').value;
                const password = document.getElementById('password').value;

                console.log('Registration:', registration_number);

                // Validate
                if (!registration_number || !password) {
                    showError('Please fill in all fields');
                    return;
                }

                // Show loading
                const originalText = loginBtn.textContent;
                loginBtn.textContent = 'Logging in...';
                loginBtn.disabled = true;
                errorMessage.style.display = 'none';

                try {
                    console.log('Sending login request...');
                    const response = await APP.API.post('/auth/login', {
                        registration_number,
                        password
                    });

                    console.log('Login response:', response);

                    if (response.success) {
                        console.log('Login successful, storing tokens...');

                        // If backend returns a custom token (accessToken), sign in to Firebase Client SDK
                        if (response.data.accessToken && window.firebaseAuth && window.signInWithCustomToken) {
                            try {
                                console.log('Signing in to Firebase with custom token...');
                                const userCredential = await window.signInWithCustomToken(window.firebaseAuth, response.data.accessToken);
                                const idToken = await userCredential.user.getIdToken();

                                // Use the ID token for subsequent requests
                                APP.Storage.set('accessToken', idToken);
                            } catch (firebaseError) {
                                console.error('Firebase Custom Token Sign-In Failed:', firebaseError);
                                // Fallback to using the custom token directly if it was meant to be a JWT (but we changed it to Custom Token)
                                // If it fails, we might have issues.
                                APP.Storage.set('accessToken', response.data.accessToken);
                            }
                        } else {
                            APP.Storage.set('accessToken', response.data.accessToken);
                        }

                        APP.Storage.set('refreshToken', response.data.refreshToken);
                        APP.Storage.set('user', response.data.user);

                        // Verify storage
                        console.log('Verifying stored data...');
                        console.log('Access token stored:', !!APP.Storage.get('accessToken'));
                        console.log('User stored:', APP.Storage.get('user'));
                        console.log('Is authenticated:', APP.isAuthenticated());
                        console.log('User role:', APP.getUserRole());

                        // Show success
                        if (typeof APP.showToast === 'function') {
                            APP.showToast('Login successful!', 'success');
                        }
                        showError('✅ Login successful! Redirecting...');
                        errorMessage.style.color = '#10b981';

                        // Redirect based on role
                        const dashboards = {
                            student: '/dashboard/student.html',
                            teacher: '/dashboard/teacher.html',
                            admin: '/dashboard/admin.html'
                        };

                        const redirectUrl = dashboards[response.data.user.role] || '/dashboard/student.html';
                        console.log('Redirecting to:', redirectUrl);

                        setTimeout(() => {
                            window.location.href = redirectUrl;
                        }, 1000);
                    } else {
                        showError(response.message || 'Login failed');
                        loginBtn.textContent = originalText;
                        loginBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError(error.message || 'Login failed. Please check your credentials.');
                    loginBtn.textContent = originalText;
                    loginBtn.disabled = false;
                }
            });

            // Ensure footer links work correctly on touch
            const registerLink = document.querySelector('.login-footer a[href="register.html"]');
            const homeLink = document.querySelector('.login-footer .back-link');
            function ensureNav(el, href) {
                if (!el) return;
                // Remove any existing problematic listeners by cloning
                const clone = el.cloneNode(true);
                el.parentNode.replaceChild(clone, el);
                clone.addEventListener('click', (ev) => {
                    ev.preventDefault();
                    window.location.href = href;
                }, { passive: false });
                clone.addEventListener('touchend', (ev) => {
                    ev.preventDefault();
                    window.location.href = href;
                }, { passive: false });
            }
            ensureNav(registerLink, '/register.html');
            ensureNav(homeLink, '/index.html');
        });

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            if (!errorEl) return;
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function fillDemo(regNum, pass) {
            document.getElementById('registration_number').value = regNum;
            document.getElementById('password').value = pass;
            APP.showToast('Demo credentials filled. Click Login!', 'info');
        }

        // Make fillDemo global
        window.fillDemo = fillDemo;

        // Register service worker (optional)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✓ Service worker registered'))
                .catch(err => {
                    // Silent fail - service worker is optional
                    console.log('Service worker not available (optional feature)');
                });
        }
    </script>
    <script src="/js/chatbot.js"></script>
</body>

</html>
