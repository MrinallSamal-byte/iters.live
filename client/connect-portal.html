<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>Connect Portal - ITER EduHub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/responsive-enhanced.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="/css/responsive-universal.css">
    <link rel="stylesheet" href="/css/button-fixes.css">
    <link rel="stylesheet" href="/css/login-split.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        .portal-connect-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px var(--glass-shadow);
        }

        .portal-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .portal-header h1 {
            font-size: 1.75rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .portal-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .portal-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* Data Source Selection */
        .data-source-selection {
            margin-bottom: 1.5rem;
        }

        .data-source-selection h3 {
            color: var(--text-primary);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .source-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .source-option {
            padding: 1.25rem;
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .source-option:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .source-option.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
        }

        .source-option .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .source-option h4 {
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .source-option p {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        /* Login Form */
        .portal-form {
            display: none;
            margin-bottom: 1.5rem;
        }

        .portal-form.visible {
            display: block;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Status Message */
        .status-message {
            display: none;
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .status-message.loading {
            display: block;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }

        .status-message.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .status-message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        /* Retry Info */
        .retry-info {
            display: none;
            padding: 0.75rem;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: var(--radius-md);
            color: #fbbf24;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .retry-info.visible {
            display: block;
        }

        /* Attempt Counter */
        .attempt-counter {
            display: none;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 1rem;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            padding: 0.875rem;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .skip-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--glass-border);
        }

        .skip-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .skip-link a:hover {
            color: var(--primary);
        }

        /* Toast notification */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            z-index: 10000;
            animation: slideIn 0.3s ease-out;
        }

        .toast-notification.success {
            background: rgba(34, 197, 94, 0.9);
            color: white;
        }

        .toast-notification.error {
            background: rgba(239, 68, 68, 0.9);
            color: white;
        }

        .toast-notification.warning {
            background: rgba(245, 158, 11, 0.9);
            color: white;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Backup option */
        .backup-option {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
        }

        .backup-option button {
            background: transparent;
            color: var(--text-secondary);
            padding: 0.75rem;
            border: 1px dashed var(--glass-border);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .backup-option button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="bg-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="portal-connect-container">
        <div class="portal-card">
            <div class="portal-header">
                <div class="portal-icon">🔗</div>
                <h1>Connect Your Portal</h1>
                <p>Choose how you want to load your data</p>
            </div>

            <!-- Data Source Selection -->
            <div class="data-source-selection" id="dataSourceSelection">
                <h3>Select Data Source</h3>
                <div class="source-options">
                    <div class="source-option" id="optionLive" data-source="live">
                        <div class="icon">🌐</div>
                        <h4>Pull Real Data</h4>
                        <p>Sync from SOA Portal</p>
                    </div>
                    <div class="source-option" id="optionDemo" data-source="demo">
                        <div class="icon">🎭</div>
                        <h4>Demo Data</h4>
                        <p>Explore with sample data</p>
                    </div>
                </div>
            </div>

            <!-- Portal Login Form -->
            <form class="portal-form" id="portalForm">
                <div class="form-group">
                    <label for="regNumber">Registration Number</label>
                    <input type="text" id="regNumber" name="regNumber" placeholder="e.g., 2101234567" required>
                </div>
                <div class="form-group">
                    <label for="portalPassword">SOA Portal Password</label>
                    <input type="password" id="portalPassword" name="portalPassword" placeholder="Enter your portal password" required>
                </div>
                <div class="credential-status" id="credentialStatus" style="display: none;">
                    <small style="color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between;">
                        <span>✓ Credentials saved</span>
                        <button type="button" id="clearCredentialsBtn" style="background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.85rem; padding: 0; text-decoration: underline;">Clear</button>
                    </small>
                </div>
            </form>

            <!-- Status Messages -->
            <div class="status-message" id="statusMessage"></div>
            <div class="retry-info" id="retryInfo"></div>
            <div class="attempt-counter" id="attemptCounter"></div>

            <!-- Actions -->
            <div class="portal-actions">
                <button type="button" class="btn-primary" id="syncBtn" style="display: none;">
                    🔄 Fetch Data from SOA Portal
                </button>
                <button type="button" class="btn-primary" id="demoBtn" style="display: none;">
                    🎭 Continue with Demo Data
                </button>
            </div>

            <!-- Backup Option -->
            <div class="backup-option" id="backupOption" style="display: none;">
                <button type="button" id="loadBackupBtn">
                    📂 Load Previously Saved Data
                </button>
            </div>

            <div class="skip-link">
                <a href="/login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span class="theme-icon">🌙</span>
    </button>

    <script src="/js/main.js"></script>
    <script src="/js/linkEncoding.js"></script>
    <script src="/js/connect-portal.js"></script>
</body>

</html>
