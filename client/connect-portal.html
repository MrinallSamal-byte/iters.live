<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>Portal Sync Suspended - ITER EduHub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/responsive-enhanced.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="/css/responsive-universal.css">
    <link rel="stylesheet" href="/css/button-fixes.css">
    <link rel="stylesheet" href="/css/login-split.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        .portal-connect-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 32px var(--glass-shadow);
        }

        .portal-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .portal-header h1 {
            font-size: 1.75rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .portal-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .portal-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* TEMPORARILY DISABLED — DO NOT REMOVE */
        /* Suspended message styling */
        .suspended-message {
            text-align: center;
            padding: 2rem;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
        }

        .suspended-message .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .suspended-message h2 {
            color: #f59e0b;
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .suspended-message p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn-demo {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 1rem;
        }

        .btn-demo:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            padding: 0.875rem;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .skip-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--glass-border);
        }

        .skip-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .skip-link a:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="bg-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="portal-connect-container">
        <div class="portal-card">
            <div class="portal-header">
                <div class="portal-icon">🔗</div>
                <h1>Portal Data Sync</h1>
            </div>

            <!-- TEMPORARILY DISABLED — DO NOT REMOVE -->
            <!-- Suspended message displayed when portal features are disabled -->
            <div class="suspended-message" id="suspendedMessage">
                <div class="icon">⏸️</div>
                <h2>Portal Sync Temporarily Suspended</h2>
                <p>Portal data syncing is temporarily suspended. Please try again later.</p>
                <p style="margin-top: 0.5rem;">You can continue using the app with demo data to explore all features.</p>
            </div>

            <div class="portal-actions">
                <button type="button" class="btn-demo" id="demoBtn">
                    🎭 Continue with Demo Data
                </button>
                <a href="/dashboard/student.html" class="btn-secondary">
                    Go to Dashboard →
                </a>
            </div>

            <div class="skip-link">
                <a href="/login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span class="theme-icon">🌙</span>
    </button>

    <script src="/js/main.js"></script>
    <script src="/js/linkEncoding.js"></script>
    <script src="/js/connect-portal.js"></script>
</body>

</html>
