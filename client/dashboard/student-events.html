<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events · ITERasn hub</title>
    <meta name="description" content="Events on ITERasn hub, the portal for ITER, SOA University students, teachers and admins.">
    <meta name="theme-color" content="#0f0b0b">
    <link rel="icon" href="/assets/icon.png">
    <link rel="apple-touch-icon" href="/assets/icon.png">
    <!-- SECURITY: Immediate authentication check before any content loads -->
    <script>
        (function() {
            'use strict';
            // Check if user is authenticated before showing any content
            function checkAuth() {
                try {
                    var accessToken = localStorage.getItem('accessToken');
                    var user = localStorage.getItem('user');
                    if (!accessToken || !user) return false;
                    var userData = JSON.parse(user);
                    return userData && userData.role === 'student';
                } catch (e) {
                    return false;
                }
            }
            // If not authenticated, redirect immediately
            if (!checkAuth()) {
                // Store intended destination
                try {
                    sessionStorage.setItem('loginRedirect', window.location.pathname);
                    sessionStorage.setItem('loginMessage', 'Please log in to access the Student Events.');
                } catch (e) {}
                window.location.replace('/login.html');
                // Stop script execution and prevent any content from loading
                document.documentElement.innerHTML = '';
                var redirectFallbackNotice = document.createElement('p');
                redirectFallbackNotice.textContent = 'Redirecting to login...';
                document.documentElement.appendChild(redirectFallbackNotice); return;
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/site/tokens.css">
    <link rel="stylesheet" href="../css/site/base.css">
    <link rel="stylesheet" href="../css/site/app.css">
    <link rel="stylesheet" href="../css/site/chatbot.css">
    
    
    <link rel="manifest" href="/manifest.json">
    
</head>
<body>
    <!-- Sidebar will be injected by student-sidebar.js -->
    
    <!-- Main Content -->
    <main class="dashboard-main" aria-label="Student Events main content" id="main-content">
        <!-- Page Hero -->
        <section class="page-hero glass-card scroll-reveal">
            <div class="hero-content-inline">
                <div>
                    <h1 class="page-title">Campus Events</h1>
                    <p class="page-subtitle">Discover and register for exciting college events</p>
                </div>
            </div>
        </section>

        <!-- Quick Stats -->
        <section class="quick-stats stagger-animation">
            <div class="stat-box info hover-lift scroll-reveal">
                <div class="stat-number" id="totalEvents">--</div>
                <div class="stat-text">Total Events</div>
            </div>
            <div class="stat-box success hover-lift scroll-reveal">
                <div class="stat-number" id="registeredEvents">--</div>
                <div class="stat-text">Registered</div>
            </div>
            <div class="stat-box warning hover-lift scroll-reveal">
                <div class="stat-number" id="upcomingEvents">--</div>
                <div class="stat-text">Upcoming</div>
            </div>
            <div class="stat-box hover-lift scroll-reveal">
                <div class="stat-number" id="todayEvents">--</div>
                <div class="stat-text">Today</div>
            </div>
        </section>

        <!-- Event Filters -->
        <section class="dashboard-section glass-card hover-lift scroll-reveal">
            <div class="section-header-formal">
                <h2 class="section-title-formal">
                    Filter Events
                </h2>
            </div>
            <div class="event-filters">
                <button class="filter-chip active" data-category="all">All Events</button>
                <button class="filter-chip" data-category="technical">Technical</button>
                <button class="filter-chip" data-category="cultural">Cultural</button>
                <button class="filter-chip" data-category="sports">Sports</button>
                <button class="filter-chip" data-category="workshop">Workshop</button>
                <button class="filter-chip" data-category="seminar">Seminar</button>
                <button class="filter-chip" data-category="competition">Competition</button>
            </div>
        </section>

        <!-- Events Grid -->
        <section class="dashboard-section glass-card hover-lift scroll-reveal">
            <div class="section-header-formal">
                <h2 class="section-title-formal">
                    Available Events
                </h2>
                <span class="section-badge">Browse &amp; Register</span>
            </div>
            <div class="events-grid" id="eventsGrid">
                <!-- CUT CORNER: student-events.js re-injects .empty-state-icon with an emoji on empty results (file not in ownership scope) -->
                <div class="empty-state">
                    <div class="loading-text">Loading events…</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span class="theme-icon" aria-hidden="true"></span>
    </button>

    <!-- Scripts -->
    <script defer src="/js/universal-sidebar.js"></script>
    <script defer src="/js/toast.js"></script>
    <script defer src="/js/page-access-token.js"></script>
    <script defer src="/js/session-timeout.js"></script>
    <script defer src="/js/main.js"></script>
    <script defer src="/js/live-updates.js"></script>
    <script defer src="/js/linkEncoding.js"></script>
    <script defer src="/js/pages/student-events.js"></script>
    <script defer src="/js/chatbot.js"></script>
    
    <style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: brand · redesign: full · scope: app · built: the project · v2.0.0 */
        .page-hero {
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .hero-content-inline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-lg);
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: var(--space-xs);
            color: var(--r-text);
        }

        .page-subtitle {
            font-size: 1.125rem;
            color: var(--r-text-3);
        }

        .event-filters {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            margin-top: var(--space-lg);
        }

        .filter-chip {
            padding: 0.6rem 1.25rem;
            background: transparent;
            border: 1px solid var(--r-line-strong);
            border-radius: 2px;
            color: var(--r-text-2);
            font-family: var(--font-body);
            font-size: 0.68rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
            cursor: pointer;
            transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
        }

        .filter-chip:hover {
            border-color: var(--r-accent);
            color: var(--r-text);
        }

        .filter-chip.active {
            background: var(--r-accent);
            border-color: var(--r-accent);
            color: var(--color-accent-ink);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-lg);
            margin-top: var(--space-lg);
        }

        .event-card {
            background: var(--r-panel-raised);
            border: 1px solid var(--r-line);
            border-radius: 2px;
            overflow: clip;
            transition: border-color 160ms ease;
            cursor: pointer;
        }

        .event-card:hover {
            border-color: var(--r-line-strong);
        }

        .event-banner {
            height: 150px;
            background:
                radial-gradient(color-mix(in oklab, var(--color-ink) 8%, transparent) 1px, transparent 1px) 0 0 / 14px 14px,
                var(--r-panel-inset);
            border-bottom: 1px dotted var(--r-line-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
            overflow: clip;
        }

        .event-category-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.35rem 0.65rem;
            border-radius: 0;
            background: color-mix(in oklab, var(--color-paper) 70%, transparent);
            border: 1px solid var(--r-line-strong);
            font-family: var(--font-body);
            font-size: 0.6rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
            color: var(--color-ink);
        }

        .event-content {
            padding: var(--space-lg);
        }

        .event-title {
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: none;
            letter-spacing: normal;
            margin-bottom: var(--space-sm);
            color: var(--r-text);
        }

        .event-meta {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding-bottom: 0.9rem;
            margin-bottom: 0.9rem;
            border-bottom: 1px dotted var(--r-line-strong);
            font-family: var(--font-body);
            font-size: 0.72rem;
            text-transform: none;
            letter-spacing: normal;
            color: var(--r-text-3);
        }

        .event-meta-item {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .event-description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--r-text-2);
            margin-bottom: var(--space-md);
        }

        .event-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: var(--space-md);
            border-top: 1px solid var(--r-line);
        }

        .event-participants {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            font-family: var(--font-body);
            font-size: 0.68rem;
            text-transform: none;
            letter-spacing: normal;
            color: var(--r-text-3);
        }

        .register-btn {
            padding: 0.55rem 1.4rem;
            border-radius: 2px;
            background: var(--r-accent);
            border: 1px solid var(--r-accent);
            color: var(--color-accent-ink);
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.66rem;
            font-weight: 600;
            text-transform: none;
            letter-spacing: normal;
            transition: background 160ms ease, border-color 160ms ease;
        }

        .register-btn:hover {
            background: var(--r-accent-deep);
            border-color: var(--r-accent-deep);
        }

        .register-btn.registered {
            background: transparent;
            border-color: var(--r-line-strong);
            color: var(--r-text-2);
            cursor: default;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem var(--space-md);
            color: var(--r-text-3);
        }

        @media (max-width: 768px) {
            .events-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ============================================================
           RESPONSIVE OVERRIDES (1920 / 1440 / 1024 / 900 / 768 / 560 / 480 / 360)
           Sidebar offset is handled by universal-sidebar.css (released <=968px);
           this page hardcodes no margin-left of its own.
           ============================================================ */

        html,
        body {
            max-width: 100%;
            overflow-x: clip;
        }

        .event-title,
        .event-description,
        .event-meta-item {
            overflow-wrap: anywhere;
            min-width: 0;
        }

        /* Wide screens: cap card columns */
        @media (min-width: 1440px) {
            body:not(.nothing-home) .dashboard-main .events-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* Card grid: 2 columns */
        @media (max-width: 900px) {
            body:not(.nothing-home) .dashboard-main .events-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .page-hero {
                padding: 1.75rem;
            }
        }

        /* Stacking, 16px inputs, >=44px touch targets */
        @media (max-width: 768px) {
            .hero-content-inline {
                flex-direction: column;
                align-items: stretch;
                gap: 1.25rem;
            }

            .page-title {
                font-size: clamp(1.75rem, 7vw, 2.25rem);
            }

            .page-subtitle {
                font-size: 1rem;
            }

            .event-filters {
                gap: var(--space-xs);
            }

            .filter-chip {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
            }

            .register-btn {
                min-height: 44px;
            }

            .event-content {
                padding: 1.15rem;
            }
        }

        /* Card grid: 1 column */
        @media (max-width: 560px) {
            body:not(.nothing-home) .dashboard-main .events-grid {
                grid-template-columns: 1fr;
            }

            .event-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 0.85rem;
            }

            .event-participants {
                justify-content: center;
            }

            .register-btn {
                width: 100%;
            }

            .event-banner {
                height: 118px;
                font-size: 2.4rem;
            }

            .empty-state {
                padding: 2rem var(--space-sm);
            }
        }

        @media (max-width: 480px) {
            .page-hero {
                padding: 1.25rem;
            }

            .filter-chip {
                padding: 0.55rem 0.9rem;
                letter-spacing: normal;
            }
        }

        /* 360px: no horizontal page scroll */
        @media (max-width: 360px) {
            .page-hero {
                padding: var(--space-md);
            }

            .event-content {
                padding: 0.95rem;
            }

            .section-badge {
                display: none;
            }
        }
    </style>
</body>
</html>
