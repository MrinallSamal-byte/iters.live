<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Forum - ITERasn hub</title>
    <!-- SECURITY: Immediate authentication check before any content loads -->
    <script>
        (function() {
            'use strict';
            // Check if user is authenticated before showing any content
            function checkAuth() {
                try {
                    var accessToken = localStorage.getItem('accessToken');
                    var user = localStorage.getItem('user');
                    if (!accessToken || !user) return false;
                    var userData = JSON.parse(user);
                    return userData && userData.role === 'student';
                } catch (e) {
                    return false;
                }
            }
            // If not authenticated, redirect immediately
            if (!checkAuth()) {
                // Store intended destination
                try {
                    sessionStorage.setItem('loginRedirect', window.location.pathname);
                    sessionStorage.setItem('loginMessage', 'Please log in to access the Student Forum.');
                } catch (e) {}
                window.location.replace('/login.html');
                // Stop script execution and prevent any content from loading
                document.documentElement.innerHTML = '';
                var redirectFallbackNotice = document.createElement('p');
                redirectFallbackNotice.textContent = 'Redirecting to login...';
                document.documentElement.appendChild(redirectFallbackNotice); return;
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/clean-dashboard.css">
    <link rel="stylesheet" href="/css/universal-sidebar.css">
    <link rel="stylesheet" href="/css/universal-profile.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="/css/responsive-universal.css">
    <link rel="stylesheet" href="/css/chatbot.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/table-responsive-global.css">
    <link rel="stylesheet" href="/css/refined-ui.css">
</head>
<body>
    <!-- Main Content -->
    <main class="dashboard-main">
        <!-- Page Hero -->
        <section class="page-hero glass-card scroll-reveal">
            <div class="hero-content-inline">
                <div>
                    <h1 class="page-title">Student Forum</h1>
                    <p class="page-subtitle">Ask questions, share knowledge, and connect with peers &amp; faculty</p>
                </div>
                <button class="btn btn-primary btn-lg" onclick="openNewQuestionModal()">
                    Ask Question
                </button>
            </div>
        </section>

        <!-- Quick Stats -->
        <section class="quick-stats stagger-animation">
            <div class="stat-box info hover-lift scroll-reveal">
                <div class="stat-number" id="totalQuestions">--</div>
                <div class="stat-text">Questions</div>
                <div class="stat-subtext">Total asked</div>
            </div>
            <div class="stat-box success hover-lift scroll-reveal">
                <div class="stat-number" id="answeredQuestions">--</div>
                <div class="stat-text">Answered</div>
                <div class="stat-subtext">Resolved</div>
            </div>
            <div class="stat-box warning hover-lift scroll-reveal">
                <div class="stat-number" id="activeUsers">--</div>
                <div class="stat-text">Active Users</div>
                <div class="stat-subtext">This week</div>
            </div>
            <div class="stat-box hover-lift scroll-reveal">
                <div class="stat-number" id="topContributors">--</div>
                <div class="stat-text">Top Contributors</div>
                <div class="stat-subtext">Best answers</div>
            </div>
        </section>

        <!-- Category Navigation -->
        <section class="dashboard-section glass-card hover-lift scroll-reveal">
            <div class="section-header-formal">
                <h3 class="section-title-formal">
                    Categories
                </h3>
            </div>
            <div class="category-grid">
                <button class="category-btn active" data-category="all">
                    <span class="category-name">All Topics</span>
                    <span class="category-count" id="countAll">--</span>
                </button>
                <button class="category-btn" data-category="academic">
                    <span class="category-name">Academic</span>
                    <span class="category-count" id="countAcademic">--</span>
                </button>
                <button class="category-btn" data-category="technical">
                    <span class="category-name">Technical</span>
                    <span class="category-count" id="countTechnical">--</span>
                </button>
                <button class="category-btn" data-category="placement">
                    <span class="category-name">Placement</span>
                    <span class="category-count" id="countPlacement">--</span>
                </button>
                <button class="category-btn" data-category="campus">
                    <span class="category-name">Campus Life</span>
                    <span class="category-count" id="countCampus">--</span>
                </button>
                <button class="category-btn" data-category="general">
                    <span class="category-name">General</span>
                    <span class="category-count" id="countGeneral">--</span>
                </button>
            </div>
        </section>

        <!-- Search and Filter -->
        <section class="forum-controls glass-card">
            <div class="search-filter-row">
                <div class="search-box-forum">
                    <input type="text" id="forumSearch" class="search-input" 
                        placeholder="Search questions, topics, or keywords...">
                </div>
                <select id="filterStatus" class="filter-select">
                    <option value="">All Status</option>
                    <option value="open">Open Questions</option>
                    <option value="answered">Answered</option>
                    <option value="unanswered">Unanswered</option>
                </select>
                <select id="sortOrder" class="filter-select">
                    <option value="newest">Newest First</option>
                    <option value="popular">Most Popular</option>
                    <option value="unanswered">Needs Answer</option>
                    <option value="recent-activity">Recent Activity</option>
                </select>
            </div>
            <div class="filter-tags">
                <span class="tag-label">Popular Tags:</span>
                <button class="filter-tag" data-tag="python">Python</button>
                <button class="filter-tag" data-tag="java">Java</button>
                <button class="filter-tag" data-tag="dsa">DSA</button>
                <button class="filter-tag" data-tag="dbms">DBMS</button>
                <button class="filter-tag" data-tag="placement">Placement</button>
                <button class="filter-tag" data-tag="exam">Exams</button>
            </div>
        </section>

        <!-- Questions List -->
        <section class="questions-container">
            <div id="questionsList" class="questions-list">
                <!-- Questions will be loaded here -->
                <div class="loading-text">Loading discussions...</div>
            </div>
        </section>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <!-- Pagination controls -->
        </div>

        <!-- Top Contributors -->
        <section class="dashboard-section glass-card hover-lift scroll-reveal">
            <div class="section-header-formal">
                <h3 class="section-title-formal">
                    Top Contributors
                </h3>
            </div>
            <!-- CUT CORNER: student-forum.js injects contributor medal emojis (badge field, file not in ownership scope) -->
            <div id="contributorsList" class="contributors-grid">
                <!-- Contributors will be loaded here -->
            </div>
        </section>
    </main>

    <!-- New Question Modal -->
    <div id="newQuestionModal" class="modal" style="display: none;">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3>Ask a Question</h3>
                <button class="modal-close" onclick="closeNewQuestionModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="newQuestionForm">
                    <div class="form-group">
                        <label class="form-label">
                            Question Title
                        </label>
                        <input type="text" id="questionTitle" class="form-input" 
                            placeholder="What's your question? Be specific and clear..." required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            Category
                        </label>
                        <select id="questionCategory" class="form-select" required>
                            <option value="">Select a category</option>
                            <option value="academic">Academic</option>
                            <option value="technical">Technical</option>
                            <option value="placement">Placement</option>
                            <option value="campus">Campus Life</option>
                            <option value="general">General</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            Description
                        </label>
                        <textarea id="questionDescription" class="form-textarea" rows="6"
                            placeholder="Provide more details about your question. Include any relevant context, what you've tried, or specific issues you're facing..."
                            required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            Tags (comma separated)
                        </label>
                        <input type="text" id="questionTags" class="form-input" 
                            placeholder="e.g., python, algorithms, exam">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeNewQuestionModal()">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            Post Question
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Question Detail Modal -->
    <div id="questionDetailModal" class="modal" style="display: none;">
        <div class="modal-content glass-card modal-large">
            <div class="modal-header">
                <h3 id="modalQuestionTitle">Question Title</h3>
                <button class="modal-close" onclick="closeQuestionDetailModal()">✕</button>
            </div>
            <div class="modal-body" id="questionDetailBody">
                <!-- Question details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span class="theme-icon">🌙</span>
    </button>

    <!-- Scripts -->
    <script src="/js/toast.js"></script>
    <script src="/js/page-access-token.js"></script>
    <script src="/js/session-timeout.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/linkEncoding.js"></script>
    <script src="/js/dummy-data.js"></script>
    <script src="/js/dummy-data-init.js"></script>
    <script src="/js/universal-sidebar.js"></script>
    <script src="/js/universal-profile.js"></script>
    <script src="/js/chatbot.js"></script>
    <script src="/js/pages/student-forum.js"></script>

    <style>
        .page-hero {
            padding: 2rem;
            margin-bottom: 2rem;
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--r-text);
        }

        .page-subtitle {
            font-size: 1.125rem;
            color: var(--r-text-3);
        }

        .stat-subtext {
            font-family: var(--r-font-mono);
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--r-text-3);
            margin-top: 0.25rem;
        }

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;

            color: var(--r-text);
        }

        .category-btn.active {
            background: var(--r-accent);
            color: #ffffff;
            border-color: var(--r-accent);
        }

        .category-name {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .category-count {
            font-family: var(--r-font-mono);
            font-size: 0.64rem;
            padding: 0.2rem 0.5rem;
            background: transparent;
            border: 1px dotted currentColor;
            border-radius: 0;
        }

        /* Forum Controls */
        .forum-controls {
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            border-radius: 2px;
        }

        .search-filter-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .search-box-forum {

            min-width: 300px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--r-panel-inset);
            border: 1px solid var(--r-line-strong);
            border-radius: 2px;
            color: var(--r-text);
            font-size: 0.95rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--r-accent);
        }

        .filter-select {
            padding: 0.75rem 1rem;
            background: var(--r-panel-inset);
            border: 1px solid var(--r-line-strong);
            border-radius: 2px;
            color: var(--r-text);
            font-size: 0.95rem;
            min-width: 150px;
        }

        .filter-select:focus {

        }

        .filter-tags {

            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--r-text-2);
            cursor: pointer;
            transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: var(--r-accent);
            color: #ffffff;
            border-color: var(--r-accent);
        }

        /* Questions List */
        .questions-container {
            margin-bottom: 2rem;
        }

        .questions-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .question-card {
            background: var(--r-panel-raised);
            border: 1px solid var(--r-line);
            border-radius: 2px;
            padding: 1.5rem;
            transition: border-color 160ms ease;
            cursor: pointer;
        }

        .question-card:hover {
            border-color: var(--r-line-strong);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--r-text);
            margin: 0;
            line-height: 1.4;
        }

        .question-status {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.28rem 0.6rem;
            border-radius: 0;
            font-family: var(--r-font-mono);
            font-size: 0.58rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            flex-shrink: 0;
        }

        .status-answered {
            background: transparent;
            border: 1px solid var(--r-line-strong);
            color: var(--r-text);
        }

        .status-open {
            background: var(--r-accent-wash);
            border: 1px solid var(--r-accent);
            color: var(--r-accent);
        }

        .question-excerpt {
            color: var(--r-text-2);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .question-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            padding-top: 0.9rem;
            border-top: 1px dotted var(--r-line-strong);
            font-family: var(--r-font-mono);
            font-size: 0.68rem;
            color: var(--r-text-3);
        }

        .question-author {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--r-text-2);
        }

        .author-avatar {
            width: 28px;
            height: 28px;
            background: var(--r-panel-inset);
            border: 1px solid var(--r-line-strong);
            border-left: 2px solid var(--r-accent);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--r-text);
            font-family: var(--r-font-mono);
            font-weight: 600;
            font-size: 0.7rem;
        }

        .question-stats {
            display: flex;
            gap: 1rem;
            color: var(--r-text-3);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .question-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .question-tag {
            padding: 0.22rem 0.5rem;
            background: transparent;
            color: var(--r-text-2);
            border: 1px dotted var(--r-line-strong);
            border-radius: 0;
            font-family: var(--r-font-mono);
            font-size: 0.6rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .page-btn {
            padding: 0.45rem 0.95rem;
            background: transparent;
            border: 1px solid var(--r-line-strong);
            border-radius: 0;
            color: var(--r-text-2);
            font-family: var(--r-font-mono);
            font-size: 0.68rem;
            cursor: pointer;
            transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
        }

        .page-btn:hover,
        .page-btn.active {
            background: var(--r-accent);
            color: #ffffff;
            border-color: var(--r-accent);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Contributors Grid */
        .contributors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .contributor-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--r-panel-raised);
            border: 1px solid var(--r-line);
            border-radius: 2px;
            transition: border-color 160ms ease;
        }

        .contributor-card:hover {
            border-color: var(--r-line-strong);
        }

        .contributor-avatar {
            width: 45px;
            height: 45px;
            background: var(--r-panel-inset);
            border: 1px solid var(--r-line-strong);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--r-text);
            font-family: var(--r-font-display);
            font-weight: 700;
            font-size: 1rem;
        }

        .contributor-info {
            flex: 1;
        }

        .contributor-name {
            font-weight: 600;
            color: var(--r-text);
            font-size: 0.92rem;
        }

        .contributor-stats {
            font-family: var(--r-font-mono);
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--r-text-3);
        }

        .contributor-badge {
            font-size: 1.25rem;
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 1rem;
        }

        .modal-content {
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 0;
            border: 1px solid var(--r-line-strong);
        }

        .modal-large {
            max-width: 800px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px dotted var(--r-line-strong);
        }

            color: var(--r-text);
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin: 0;
        }

            background: transparent;
            border: 1px solid var(--r-line-strong);
            width: 36px;
            height: 36px;
            border-radius: 0;
            font-size: 1rem;
            cursor: pointer;
            color: var(--r-text-3);
            transition: border-color 160ms ease, color 160ms ease;
        }

        .modal-close:hover {
            border-color: var(--r-accent);
            color: var(--r-accent);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--r-font-mono);
            font-size: 0.66rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin-bottom: 0.5rem;
            color: var(--r-text-2);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--r-panel-inset);
            border: 1px solid var(--r-line-strong);
            border-radius: 2px;
            color: var(--r-text);
            font-size: 0.95rem;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--r-accent);
        }

        .form-textarea {
            resize: vertical;
            font-family: inherit;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .loading-text {
            text-align: center;
            padding: 3rem;
            color: var(--r-text-3);
            font-family: var(--r-font-mono);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        /* Answer Section in Modal - flat bordered panels */
        .answer-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px dotted var(--r-line-strong);
        }

        .answer-card {
            padding: 1.25rem;
            background: var(--r-panel-raised);
            border: 1px solid var(--r-line);
            border-radius: 0;
            margin-bottom: 1rem;
        }

        .answer-card.accepted {
            border-color: var(--r-line-strong);
            border-left: 2px solid var(--r-accent);
            background: var(--r-panel-raised);
        }

        .answer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .answer-author {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .answer-content {
            color: var(--r-text);
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }
