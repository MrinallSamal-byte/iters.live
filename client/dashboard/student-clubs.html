<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs - ITERasn hub</title>
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="/assets/icon.png">
    <link rel="apple-touch-icon" href="/assets/icon.png">
    <!-- SECURITY: Immediate authentication check before any content loads -->
    <script>
        (function() {
            'use strict';
            // Check if user is authenticated before showing any content
            function checkAuth() {
                try {
                    var accessToken = localStorage.getItem('accessToken');
                    var user = localStorage.getItem('user');
                    if (!accessToken || !user) return false;
                    var userData = JSON.parse(user);
                    return userData && userData.role === 'student';
                } catch (e) {
                    return false;
                }
            }
            // If not authenticated, redirect immediately
            if (!checkAuth()) {
                // Store intended destination
                try {
                    sessionStorage.setItem('loginRedirect', window.location.pathname);
                    sessionStorage.setItem('loginMessage', 'Please log in to access the Student Clubs.');
                } catch (e) {}
                window.location.replace('/login.html');
                // Stop script execution and prevent any content from loading
                document.documentElement.innerHTML = '';
                var redirectFallbackNotice = document.createElement('p');
                redirectFallbackNotice.textContent = 'Redirecting to login...';
                document.documentElement.appendChild(redirectFallbackNotice); return;
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/clean-dashboard.css">
    <link rel="stylesheet" href="/css/universal-sidebar.css">
    <link rel="stylesheet" href="/css/chatbot.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/table-responsive-global.css">
    <link rel="stylesheet" href="/css/refined-ui.css">
</head>
<body>
    <!-- Sidebar will be injected by student-sidebar.js -->
    
    <!-- Main Content -->
    <main class="dashboard-main">
        <!-- Page Hero -->
        <section class="page-hero glass-card scroll-reveal">
            <div class="hero-content-inline">
                <div>
                    <h1 class="page-title">Student Clubs</h1>
                    <p class="page-subtitle">Join clubs and connect with like-minded peers</p>
                </div>
            </div>
        </section>

        <!-- Quick Stats -->
        <section class="quick-stats stagger-animation">
            <div class="stat-box info hover-lift scroll-reveal">
                <div class="stat-number" id="totalClubs">--</div>
                <div class="stat-text">Total Clubs</div>
            </div>
            <div class="stat-box success hover-lift scroll-reveal">
                <div class="stat-number" id="myClubsCount">--</div>
                <div class="stat-text">My Clubs</div>
            </div>
            <div class="stat-box warning hover-lift scroll-reveal">
                <div class="stat-number" id="totalMembers">--</div>
                <div class="stat-text">Total Members</div>
            </div>
            <div class="stat-box hover-lift scroll-reveal">
                <div class="stat-number" id="activeClubs">--</div>
                <div class="stat-text">Active Clubs</div>
            </div>
        </section>

        <!-- My Clubs Section -->
        <section class="dashboard-section glass-card hover-lift scroll-reveal" id="myClubsSection" style="display: none;">
            <div class="section-header-formal">
                <h3 class="section-title-formal">
                    My Clubs
                </h3>
            </div>
            <div class="my-clubs-list" id="myClubsList">
                <!-- My clubs will be loaded here -->
            </div>
        </section>

        <!-- All Clubs -->
        <section class="dashboard-section glass-card hover-lift scroll-reveal">
            <div class="section-header-formal">
                <h3 class="section-title-formal">
                    All Clubs
                </h3>
                <span class="section-badge">Explore &amp; Join</span>
            </div>
            <div class="clubs-grid" id="clubsGrid">
                <!-- CUT CORNER: student-clubs.js re-injects .empty-state-icon and club emoji icons (file not in ownership scope) -->
                <div class="empty-state">
                    <div class="loading-text">Loading clubs...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span class="theme-icon">🌙</span>
    </button>

    <!-- Scripts -->
    <script src="/js/universal-sidebar.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/page-access-token.js"></script>
    <script src="/js/session-timeout.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/linkEncoding.js"></script>
    <script src="/js/pages/student-clubs.js"></script>
    <script src="/js/chatbot.js"></script>
    
    <style>
        .page-hero {
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--r-text);
        }

        .page-subtitle {
            font-size: 1.125rem;
            color: var(--r-text-3);
        }

        .my-clubs-list {
            display: grid;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .my-club-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem;
            background: var(--r-panel-raised);
            border: 1px solid var(--r-line);
            border-radius: 2px;
            transition: border-color 160ms ease;
        }

        .my-club-item:hover {
            border-color: var(--r-line-strong);
        }

        .my-club-icon {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--r-panel-inset);
            border: 1px solid var(--r-line-strong);
        }

        .my-club-info {
            flex: 1;
        }

        .my-club-name {
            font-size: 1.05rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--r-text);
            margin-bottom: 0.25rem;
        }

        .my-club-role {
            font-family: var(--r-font-mono);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--r-text-3);
        }

        .leave-btn {
            padding: 0.5rem 1.25rem;
            border-radius: 0;
            background: transparent;
            border: 1px solid var(--r-accent);
            color: var(--r-accent);
            cursor: pointer;
            font-family: var(--r-font-mono);
            font-size: 0.64rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            transition: background 160ms ease, color 160ms ease;
        }

        .leave-btn:hover {
            background: var(--r-accent);
            color: #ffffff;
        }

        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .club-card {
            background: var(--r-panel-raised);
            border: 1px solid var(--r-line);
            border-radius: 2px;
            overflow: hidden;
            transition: border-color 160ms ease;
        }

        .club-card:hover {
            border-color: var(--r-line-strong);
        }

        .club-header {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            background:
                radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px) 0 0 / 14px 14px,
                var(--r-panel-inset);
            border-bottom: 1px dotted var(--r-line-strong);
        }

        .club-content {
            padding: 1.5rem;
        }

        .club-name {
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.6rem;
            color: var(--r-text);
        }

        .club-category {
            display: inline-block;
            padding: 0.3rem 0.65rem;
            border-radius: 0;
            font-family: var(--r-font-mono);
            font-size: 0.6rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            margin-bottom: 1rem;
            background: var(--r-accent-wash);
            border: 1px solid var(--r-accent);
            color: var(--r-accent);
        }

        .club-description {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--r-text-2);
            margin-bottom: 1rem;
            min-height: 60px;
        }

        .club-stats {
            display: flex;
            gap: 1.5rem;
            padding-bottom: 0.9rem;
            margin-bottom: 1rem;
            border-bottom: 1px dotted var(--r-line-strong);
            font-family: var(--r-font-mono);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--r-text-3);
        }

        .club-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .club-footer {
            padding-top: 1rem;
            border-top: none;
        }

        .join-btn {
            width: 100%;
            padding: 0.7rem;
            border-radius: 0;
            background: var(--r-accent);
            border: 1px solid var(--r-accent);
            color: #ffffff;
            cursor: pointer;
            font-family: var(--r-font-mono);
            font-size: 0.66rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            transition: background 160ms ease, border-color 160ms ease;
        }

        .join-btn:hover {
            background: var(--r-accent-deep);
            border-color: var(--r-accent-deep);
        }

        .join-btn.joined {
            background: transparent;
            border-color: var(--r-line-strong);
            color: var(--r-text-2);
            cursor: default;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--r-text-3);
        }

        @media (max-width: 768px) {
            .clubs-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ============================================================
           RESPONSIVE OVERRIDES (1920 / 1440 / 1024 / 900 / 768 / 560 / 480 / 360)
           Sidebar offset is handled by universal-sidebar.css (released <=968px);
           this page hardcodes no margin-left of its own.
           ============================================================ */

        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        .club-name,
        .club-description,
        .my-club-name {
            overflow-wrap: anywhere;
            min-width: 0;
        }

        /* Wide screens: cap card columns */
        @media (min-width: 1440px) {
            body:not(.nothing-home) .dashboard-main .clubs-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* Card grid: 2 columns */
        @media (max-width: 900px) {
            body:not(.nothing-home) .dashboard-main .clubs-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .page-hero {
                padding: 1.75rem;
            }
        }

        /* Stacking, 16px inputs, >=44px touch targets */
        @media (max-width: 768px) {
            .hero-content-inline {
                flex-direction: column;
                align-items: stretch;
                gap: 1.25rem;
            }

            .page-title {
                font-size: clamp(1.75rem, 7vw, 2.25rem);
            }

            .page-subtitle {
                font-size: 1rem;
            }

            .leave-btn {
                min-height: 44px;
            }

            .join-btn {
                min-height: 44px;
            }

            .club-content {
                padding: 1.15rem;
            }

            .my-club-item {
                padding: 1.15rem;
            }
        }

        /* Card grid: 1 column + stacked rows */
        @media (max-width: 560px) {
            body:not(.nothing-home) .dashboard-main .clubs-grid {
                grid-template-columns: 1fr;
            }

            .my-club-item {
                flex-wrap: wrap;
                gap: 0.85rem;
            }

            .my-club-info {
                flex: 1 1 calc(100% - 76px);
                min-width: 0;
            }

            .my-club-icon {
                width: 48px;
                height: 48px;
                font-size: 1.9rem;
            }

            .leave-btn {
                width: 100%;
            }

            .club-header {
                height: 96px;
                font-size: 2.6rem;
            }

            .club-stats {
                flex-wrap: wrap;
                gap: 0.75rem 1.25rem;
            }

            .empty-state {
                padding: 2rem 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .page-hero {
                padding: 1.25rem;
            }
        }

        /* 360px: no horizontal page scroll */
        @media (max-width: 360px) {
            .page-hero {
                padding: 1rem;
            }

            .club-content,
            .my-club-item {
                padding: 0.95rem;
            }

            .section-badge {
                display: none;
            }
        }
    </style>
</body>
</html>
