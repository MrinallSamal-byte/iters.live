<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics · ITERasn hub</title>
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="/assets/icon.png">
    <link rel="apple-touch-icon" href="/assets/icon.png">
    <!-- SECURITY: Immediate authentication check before any content loads -->
    <script>
        (function() {
            'use strict';
            // Check if user is authenticated before showing any content
            function checkAuth() {
                try {
                    var accessToken = localStorage.getItem('accessToken');
                    var user = localStorage.getItem('user');
                    if (!accessToken || !user) return false;
                    var userData = JSON.parse(user);
                    return userData && userData.role === 'admin';
                } catch (e) {
                    return false;
                }
            }
            // If not authenticated, redirect immediately
            if (!checkAuth()) {
                // Store intended destination
                try {
                    sessionStorage.setItem('loginRedirect', window.location.pathname);
                    sessionStorage.setItem('loginMessage', 'Please log in to access the Admin Analytics.');
                } catch (e) {}
                window.location.replace('/login.html');
                // Stop script execution and prevent any content from loading
                document.documentElement.innerHTML = '';
                var redirectFallbackNotice = document.createElement('p');
                redirectFallbackNotice.textContent = 'Redirecting to login...';
                document.documentElement.appendChild(redirectFallbackNotice); return;
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/universal-sidebar.css">
    <link rel="stylesheet" href="/css/table-responsive-global.css">
    <link rel="stylesheet" href="/css/chatbot.css">
    <link rel="stylesheet" href="/css/refined-ui.css">
</head>
<body>
    <main class="dashboard-main" aria-label="Admin Analytics main content" id="main-content">
        <section class="page-hero glass-card">
            <h1 class="page-title"> System Analytics </h1>
            <p class="page-subtitle">PLATFORM TOTALS &mdash; FILES / ASSIGNMENTS / EVENTS</p>
        </section>

        <section class="quick-stats stagger-animation">
            <div class="stat-box">
                <div class="stat-number" id="totalFiles">--</div>
                <div class="stat-text">Total Files</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalAssignments">--</div>
                <div class="stat-text">Assignments</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalEvents">--</div>
                <div class="stat-text">Events</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="avgAttendance">--%</div>
                <div class="stat-text">Avg Attendance</div>
            </div>
        </section>

        <div class="dashboard-grid">
            <section class="dashboard-section glass-card">
                <h2>User Distribution</h2>
                <div class="chart-wrapper">
                    <canvas id="userChart" height="250"></canvas>
                </div>
            </section>

            <section class="dashboard-section glass-card">
                <h2>Department Statistics</h2>
                <div class="chart-wrapper">
                    <canvas id="deptChart" height="250"></canvas>
                </div>
            </section>
        </div>

        <section class="dashboard-section glass-card">
            <h2>Recent Activity Log</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="activityLogBody">
                    <tr><td colspan="4" class="loading-text">Loading...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span aria-hidden="true">&gt;</span>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/universal-sidebar.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/prototype-mode.js"></script>
    <script src="/js/page-access-token.js"></script>
    <script src="/js/session-timeout.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/live-updates.js" defer></script>
    <script src="/js/linkEncoding.js"></script>
    <script src="/js/pages/admin-analytics.js"></script>
    <script src="/js/chatbot.js"></script>

    <style>
        /* ---- NOTHING EDITION - page-local normalization ---- */

        .page-hero {
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: var(--r-radius, 2px);
        }

        .page-title {
            font-family: var(--r-font-display, "Doto", sans-serif);
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.01em;
            margin-bottom: 0.5rem;
            color: var(--r-text, #f4f4f4);
        }

        .title-icon {
            font-size: 0.8em;
        }

        .page-subtitle {
            font-family: var(--r-font-mono, "IBM Plex Mono", monospace);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--r-text-3, #757575);
        }

        .dashboard-section > h3 {
            font-family: var(--r-font-display, "Doto", sans-serif);
            font-size: 1.15rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.01em;
            color: var(--r-text, #f4f4f4);
            margin: 0 0 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px dotted var(--r-line-strong, #333);
        }

        .stat-number {
            font-family: var(--r-font-display, "Doto", sans-serif);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--r-text, #f4f4f4);
        }

        .stat-text {
            font-family: var(--r-font-mono, "IBM Plex Mono", monospace);
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--r-text-3, #757575);
        }

        .chart-wrapper {
            padding: 1.5rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        /* activity log table - mono headers, dotted dividers */
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .data-table thead tr {
            background: transparent;
        }

        .data-table th {
            padding: 0.9rem 1rem;
            font-family: var(--r-font-mono, "IBM Plex Mono", monospace);
            font-size: 0.62rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            text-align: left;
            background: transparent;
            border-bottom: 1px solid var(--r-line-strong, #333);
            color: var(--r-text-3, #757575);
        }

        .data-table td {
            padding: 1rem;
            border-bottom: 1px dotted var(--r-line, #1f1f1f);
            color: var(--r-text-2, #b0b0b0);
        }

        .data-table tbody tr {
            transition: background 120ms ease;
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* script-injected action badges - squared gray outline */
        .badge.primary,
        .badge.success,
        .badge.info {
            background: var(--r-panel-inset, rgba(255, 255, 255, 0.06));
            color: var(--r-ok, #e8e8e8);
            border: 1px solid var(--r-line-strong, #333);
            border-radius: 0;
            font-family: var(--r-font-mono, "IBM Plex Mono", monospace);
            font-size: 0.62rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .badge.warning,
        .badge.danger,
        .badge-warning,
        .badge-error,
        .badge-primary {
            background: var(--r-accent-wash, rgba(215, 25, 33, 0.1));
            color: var(--r-accent, #d71921);
            border: 1px solid rgba(215, 25, 33, 0.4);
            border-radius: 0;
            font-family: var(--r-font-mono, "IBM Plex Mono", monospace);
            font-size: 0.62rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        /* re-point legacy tokens used by script-injected inline styles */
        :root {
            --error: #d71921;
            --success: #e8e8e8;
            --warning: #d71921;
        }

        .loading-text {
            text-align: center;
            padding: 1rem;
            color: var(--r-text-3, #757575);
            font-family: var(--r-font-mono, "IBM Plex Mono", monospace);
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        /* Light theme normalization */
        body.light-theme .page-title,
        body.light-theme .dashboard-section > h3,
        body.light-theme .stat-number {
            color: #0d0d0d;
        }

        body.light-theme .page-subtitle,
        body.light-theme .stat-text,
        body.light-theme .data-table th {
            color: #757575;
        }

        body.light-theme .data-table td {
            color: #4a4a4a;
            border-bottom-color: #e4e4e4;
        }

        body.light-theme .data-table tbody tr:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ==========================================================
           RESPONSIVE FIXES - 1920 / 1440 / 1024 / 768 / 480 / 360
           ========================================================== */

        /* Charts never exceed their panel */
        .chart-wrapper canvas {
            max-width: 100%;
        }

        /* <=1024: chart band collapses; stat band 4 -> 2 */
        @media (max-width: 1024px) {
            body:not(.nothing-home) .dashboard-main .dashboard-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            body:not(.nothing-home) .dashboard-main .quick-stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* <=968: universal sidebar goes off-canvas (see universal-sidebar.css);
           release its reserved margin so content spans full width */
        @media (max-width: 968px) {
            .dashboard-main {
                margin-left: 0 !important;
            }
        }

        /* <=768: type scale, iOS zoom guard, tighter panels */
        @media (max-width: 768px) {
            .page-title {
                font-size: clamp(1.6rem, 7vw, 2rem);
                overflow-wrap: anywhere;
            }

            .page-hero,
            .dashboard-section,
            .chart-wrapper {
                padding: 1.25rem;
            }
        }

        /* <=640: stat band -> 1; activity log becomes stacked cards
           (bare table scrolls internally above this width) */
        @media (max-width: 640px) {
            body:not(.nothing-home) .dashboard-main .quick-stats {
                grid-template-columns: minmax(0, 1fr);
            }

            .data-table,
            .data-table tbody,
            .data-table tr {
                display: block;
                width: 100%;
                min-width: 0;
                background: transparent;
                border-radius: 0;
                overflow: visible;
                white-space: normal;
            }

            .data-table thead {
                display: none;
            }

            .data-table td[colspan] {
                text-align: center;
            }

            .data-table td[colspan]::before {
                content: none !important;
            }

            #activityLogBody tr {
                margin-bottom: 0.75rem;
                padding: 0.9rem 0.85rem;
                border: 1px solid var(--r-line, #1f1f1f);
                border-left: 2px solid var(--r-line-strong, #333);
                background: var(--r-panel-inset, rgba(255, 255, 255, 0.02));
            }

            #activityLogBody tr:hover {
                transform: none;
                background: rgba(255, 255, 255, 0.04);
            }

            #activityLogBody td {
                display: flex;
                flex-direction: column;
                gap: 0.15rem;
                padding: 0.3rem 0;
                border-bottom: none;
                white-space: normal;
                word-break: break-word;
                overflow-wrap: anywhere;
                text-align: left;
            }

            #activityLogBody td::before {
                font-family: var(--r-font-mono, "IBM Plex Mono", monospace);
                font-size: 0.56rem;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                color: var(--r-text-3, #757575);
            }

            #activityLogBody td:nth-child(1)::before { content: "TIME"; }
            #activityLogBody td:nth-child(2)::before { content: "USER"; }
            #activityLogBody td:nth-child(3)::before { content: "ACTION"; }
            #activityLogBody td:nth-child(4)::before { content: "DETAILS"; }

            #activityLogBody td:nth-child(2) {
                font-weight: 600;
                color: var(--r-text, #f4f4f4);
            }
        }

        /* <=360: last-resort compression - zero horizontal scroll */
        @media (max-width: 360px) {
            .page-title {
                font-size: 1.45rem;
            }

            .page-subtitle {
                letter-spacing: 0.1em;
            }
        }
    </style>
</body>
</html>
