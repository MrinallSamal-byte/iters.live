<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics · ITERasn hub</title>
    <meta name="description" content="Analytics on ITERasn hub, the portal for ITER, SOA University students, teachers and admins.">
    <meta name="theme-color" content="#0f0b0b">
    <link rel="icon" href="/assets/icon.png">
    <link rel="apple-touch-icon" href="/assets/icon.png">
    <!-- SECURITY: Immediate authentication check before any content loads -->
    <script>
        (function() {
            'use strict';
            // Check if user is authenticated before showing any content
            function checkAuth() {
                try {
                    var accessToken = localStorage.getItem('accessToken');
                    var user = localStorage.getItem('user');
                    if (!accessToken || !user) return false;
                    var userData = JSON.parse(user);
                    return userData && userData.role === 'admin';
                } catch (e) {
                    return false;
                }
            }
            // If not authenticated, redirect immediately
            if (!checkAuth()) {
                // Store intended destination
                try {
                    sessionStorage.setItem('loginRedirect', window.location.pathname);
                    sessionStorage.setItem('loginMessage', 'Please log in to access the Admin Analytics.');
                } catch (e) {}
                window.location.replace('/login.html');
                // Stop script execution and prevent any content from loading
                document.documentElement.innerHTML = '';
                var redirectFallbackNotice = document.createElement('p');
                redirectFallbackNotice.textContent = 'Redirecting to login...';
                document.documentElement.appendChild(redirectFallbackNotice); return;
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/site/tokens.css">
    <link rel="stylesheet" href="../css/site/base.css">
    <link rel="stylesheet" href="../css/site/app.css">
    <link rel="stylesheet" href="../css/site/chatbot.css">
    
    
    
</head>
<body>
    <main class="dashboard-main" aria-label="Admin Analytics main content" id="main-content">
        <section class="page-hero glass-card">
            <h1 class="page-title"> System Analytics </h1>
            <p class="page-subtitle">Platform totals: files / assignments / events</p>
        </section>

        <section class="quick-stats stagger-animation">
            <div class="stat-box">
                <div class="stat-number" id="totalFiles">--</div>
                <div class="stat-text">Total Files</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalAssignments">--</div>
                <div class="stat-text">Assignments</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalEvents">--</div>
                <div class="stat-text">Events</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="avgAttendance">--%</div>
                <div class="stat-text">Avg Attendance</div>
            </div>
        </section>

        <div class="dashboard-grid">
            <section class="dashboard-section glass-card">
                <h2>User Distribution</h2>
                <div class="chart-wrapper">
                    <canvas id="userChart" height="250"></canvas>
                </div>
            </section>

            <section class="dashboard-section glass-card">
                <h2>Department Statistics</h2>
                <div class="chart-wrapper">
                    <canvas id="deptChart" height="250"></canvas>
                </div>
            </section>
        </div>

        <section class="dashboard-section glass-card">
            <h2>Recent Activity Log</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="activityLogBody">
                    <tr><td colspan="4" class="loading-text">Loading…</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
            <span class="theme-icon" aria-hidden="true"></span>
        </button>

    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script defer src="/js/universal-sidebar.js"></script>
    <script defer src="/js/toast.js"></script>
    <script defer src="/js/prototype-mode.js"></script>
    <script defer src="/js/page-access-token.js"></script>
    <script defer src="/js/session-timeout.js"></script>
    <script defer src="/js/main.js"></script>
    <script defer src="/js/live-updates.js"></script>
    <script defer src="/js/linkEncoding.js"></script>
    <script defer src="/js/pages/admin-analytics.js"></script>
    <script defer src="/js/chatbot.js"></script>

    <style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: brand · redesign: full · scope: app · built: the project · v2.0.0 */
        /* ---- NOTHING EDITION - page-local normalization ---- */

        .page-hero {
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: var(--r-radius, 2px);
        }

        .page-title {
            font-family: var(--font-body);
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: none;
            letter-spacing: 0.01em;
            margin-bottom: var(--space-xs);
            color: var(--r-text, var(--color-ink));
        }

        .title-icon {
            font-size: 0.8em;
        }

        .page-subtitle {
            font-family: var(--font-body);
            font-size: 0.75rem;
            text-transform: none;
            letter-spacing: normal;
            color: var(--r-text-3, var(--color-ink-2));
        }

        .dashboard-section > h3 {
            font-family: var(--font-body);
            font-size: 1.15rem;
            font-weight: 800;
            text-transform: none;
            letter-spacing: 0.01em;
            color: var(--r-text, var(--color-ink));
            margin: 0 0 var(--space-md);
            padding-bottom: var(--space-sm);
            border-bottom: 1px dotted var(--r-line-strong, var(--color-rule));
        }

        .stat-number {
            font-family: var(--font-body);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--r-text, var(--color-ink));
        }

        .stat-text {
            font-family: var(--font-body);
            font-size: 0.64rem;
            text-transform: none;
            letter-spacing: normal;
            color: var(--r-text-3, var(--color-ink-2));
        }

        .chart-wrapper {
            padding: var(--space-lg);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: var(--space-lg);
            margin-bottom: 2rem;
        }

        /* activity log table - mono headers, dotted dividers */
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .data-table thead tr {
            background: transparent;
        }

        .data-table th {
            padding: 0.9rem var(--space-md);
            font-family: var(--font-body);
            font-size: 0.62rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
            text-align: left;
            background: transparent;
            border-bottom: 1px solid var(--r-line-strong, var(--color-rule));
            color: var(--r-text-3, var(--color-ink-2));
        }

        .data-table td {
            padding: var(--space-md);
            border-bottom: 1px dotted var(--r-line, var(--color-rule));
            color: var(--r-text-2, var(--color-ink-2));
        }

        .data-table tbody tr {
            transition: background 120ms ease;
        }

        .data-table tbody tr:hover {
            background: color-mix(in oklab, var(--color-ink) 8%, transparent);
        }

        /* script-injected action badges - squared gray outline */
        .badge.primary,
        .badge.success,
        .badge.info {
            background: var(--r-panel-inset, color-mix(in oklab, var(--color-ink) 8%, transparent));
            color: var(--r-ok, var(--color-ink));
            border: 1px solid var(--r-line-strong, var(--color-rule));
            border-radius: 0;
            font-family: var(--font-body);
            font-size: 0.62rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
        }

        .badge.warning,
        .badge.danger,
        .badge-warning,
        .badge-error,
        .badge-primary {
            background: var(--r-accent-wash, color-mix(in oklab, var(--color-accent) 10%, transparent));
            color: var(--color-accent-text);
            border: 1px solid color-mix(in oklab, var(--color-accent) 40%, transparent);
            border-radius: 0;
            font-family: var(--font-body);
            font-size: 0.62rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
        }

        /* re-point legacy tokens used by script-injected inline styles */
        body {
            --error: var(--color-accent);
            --success: var(--color-paper-2);
            --warning: var(--color-accent);
        }

        .loading-text {
            text-align: center;
            padding: var(--space-md);
            color: var(--r-text-3, var(--color-ink-2));
            font-family: var(--font-body);
            font-size: 0.66rem;
            text-transform: none;
            letter-spacing: normal;
        }

        /* Light theme normalization */
        body.light-theme .page-title,
        body.light-theme .dashboard-section > h3,
        body.light-theme .stat-number {
            color: var(--color-ink);
        }

        body.light-theme .page-subtitle,
        body.light-theme .stat-text,
        body.light-theme .data-table th {
            color: var(--color-ink-2);
        }

        body.light-theme .data-table td {
            color: var(--color-ink);
            border-bottom-color: var(--color-rule);
        }

        body.light-theme .data-table tbody tr:hover {
            background: color-mix(in oklab, var(--color-paper) 8%, transparent);
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ==========================================================
           RESPONSIVE FIXES - 1920 / 1440 / 1024 / 768 / 480 / 360
           ========================================================== */

        /* Charts never exceed their panel */
        .chart-wrapper canvas {
            max-width: 100%;
        }

        /* <=1024: chart band collapses; stat band 4 -> 2 */
        @media (max-width: 1024px) {
            body:not(.nothing-home) .dashboard-main .dashboard-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            body:not(.nothing-home) .dashboard-main .quick-stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* <=968: universal sidebar goes off-canvas (see universal-sidebar.css);
           release its reserved margin so content spans full width */
        @media (max-width: 968px) {
            .dashboard-main {
                margin-left: 0 !important;
            }
        }

        /* <=768: type scale, iOS zoom guard, tighter panels */
        @media (max-width: 768px) {
            .page-title {
                font-size: clamp(1.6rem, 7vw, 2rem);
                overflow-wrap: anywhere;
            }

            .page-hero,
            .dashboard-section,
            .chart-wrapper {
                padding: 1.25rem;
            }
        }

        /* <=640: stat band -> 1; activity log becomes stacked cards
           (bare table scrolls internally above this width) */
        @media (max-width: 640px) {
            body:not(.nothing-home) .dashboard-main .quick-stats {
                grid-template-columns: minmax(0, 1fr);
            }

            .data-table,
            .data-table tbody,
            .data-table tr {
                display: block;
                width: 100%;
                min-width: 0;
                background: transparent;
                border-radius: 0;
                overflow: visible;
                white-space: normal;
            }

            .data-table thead {
                display: none;
            }

            .data-table td[colspan] {
                text-align: center;
            }

            .data-table td[colspan]::before {
                content: none !important;
            }

            #activityLogBody tr {
                margin-bottom: var(--space-sm);
                padding: 0.9rem 0.85rem;
                border: 1px solid var(--r-line, var(--color-rule));
                border-left: 2px solid var(--r-line-strong, var(--color-rule));
                background: var(--r-panel-inset, color-mix(in oklab, var(--color-ink) 8%, transparent));
            }

            #activityLogBody tr:hover {
                transform: none;
                background: color-mix(in oklab, var(--color-ink) 8%, transparent);
            }

            #activityLogBody td {
                display: flex;
                flex-direction: column;
                gap: 0.15rem;
                padding: 0.3rem 0;
                border-bottom: none;
                white-space: normal;
                word-break: break-word;
                overflow-wrap: anywhere;
                text-align: left;
            }

            #activityLogBody td::before {
                font-family: var(--font-body);
                font-size: 0.56rem;
                font-weight: 500;
                text-transform: none;
                letter-spacing: normal;
                color: var(--r-text-3, var(--color-ink-2));
            }

            #activityLogBody td:nth-child(1)::before { content: "TIME"; }
            #activityLogBody td:nth-child(2)::before { content: "USER"; }
            #activityLogBody td:nth-child(3)::before { content: "ACTION"; }
            #activityLogBody td:nth-child(4)::before { content: "DETAILS"; }

            #activityLogBody td:nth-child(2) {
                font-weight: 600;
                color: var(--r-text, var(--color-ink));
            }
        }

        /* <=360: last-resort compression - zero horizontal scroll */
        @media (max-width: 360px) {
            .page-title {
                font-size: 1.45rem;
            }

            .page-subtitle {
                letter-spacing: normal;
            }
        }
    </style>
</body>
</html>
