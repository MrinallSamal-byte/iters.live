<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management · ITERasn hub</title>
    <meta name="description" content="User Management on ITERasn hub, the portal for ITER, SOA University students, teachers and admins.">
    <meta name="theme-color" content="#0f0b0b">
    <link rel="icon" href="/assets/icon.png">
    <link rel="apple-touch-icon" href="/assets/icon.png">
    <!-- SECURITY: Immediate authentication check before any content loads -->
    <script>
        (function() {
            'use strict';
            // Check if user is authenticated before showing any content
            function checkAuth() {
                try {
                    var accessToken = localStorage.getItem('accessToken');
                    var user = localStorage.getItem('user');
                    if (!accessToken || !user) return false;
                    var userData = JSON.parse(user);
                    return userData && userData.role === 'admin';
                } catch (e) {
                    return false;
                }
            }
            // If not authenticated, redirect immediately
            if (!checkAuth()) {
                // Store intended destination
                try {
                    sessionStorage.setItem('loginRedirect', window.location.pathname);
                    sessionStorage.setItem('loginMessage', 'Please log in to access the Admin Users.');
                } catch (e) {}
                window.location.replace('/login.html');
                // Stop script execution and prevent any content from loading
                document.documentElement.innerHTML = '';
                var redirectFallbackNotice = document.createElement('p');
                redirectFallbackNotice.textContent = 'Redirecting to login...';
                document.documentElement.appendChild(redirectFallbackNotice); return;
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <main class="dashboard-main" aria-label="Admin Users main content" id="main-content">
        <!-- Page Hero -->
        <section class="page-hero glass-card scroll-reveal">
            <div class="hero-content-inline">
                <div>
                    <h1 class="page-title"> User Management </h1>
                    <p class="page-subtitle">Manage students, teachers, and administrators</p>
                </div>
                <div class="hero-actions">
                    <button class="btn btn-primary" onclick="showAddUserModal()">
                        + Add User
                    </button>
                    <button class="btn btn-secondary" onclick="exportUsers()">
                        Export CSV
                    </button>
                </div>
            </div>
        </section>

        <!-- Filter Section -->
        <section class="dashboard-section glass-card scroll-reveal">
            <div class="section-header-formal">
                <h2 class="section-title-formal">
                    Filter Users
                </h2>
            </div>
            
            <div class="filter-container">
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="searchUsers" class="filter-label">
                            Search
                        </label>
                        <input type="text" id="searchUsers" class="filter-input" placeholder="Search by name or reg number...">
                    </div>
                    
                    <div class="filter-group">
                        <label for="filterRole" class="filter-label">
                            Role
                        </label>
                        <select id="filterRole" class="filter-select" onchange="loadUsers()">
                            <option value="">All Roles</option>
                            <option value="student">Students</option>
                            <option value="teacher">Teachers</option>
                            <option value="admin">Admins</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="filterDept" class="filter-label">
                            Department
                        </label>
                        <select id="filterDept" class="filter-select" onchange="loadUsers()">
                            <option value="">All Departments</option>
                            <option value="CSE">Computer Science</option>
                            <option value="ECE">Electronics</option>
                            <option value="MECH">Mechanical</option>
                            <option value="CIVIL">Civil</option>
                            <option value="EEE">Electrical</option>
                            <option value="IT">Information Technology</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="filterStatus" class="filter-label">
                            Status
                        </label>
                        <select id="filterStatus" class="filter-select" onchange="loadUsers()">
                            <option value="">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="suspended">Suspended</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- Users Table -->
        <section class="dashboard-section glass-card scroll-reveal">
            <div class="section-header-formal">
                <h2 class="section-title-formal">
                    All Users
                    <span id="userCount" class="result-count"></span>
                </h2>
            </div>
            
            <div class="table-responsive">
                <table class="data-table modern-table">
                    <thead>
                        <tr>
                            <th>Reg No</th>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Department</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="7" class="loading-text">Loading users…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Add User Modal -->
    <div id="addUserModal" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="closeAddUserModal()"></div>
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3 class="modal-title">
                    Add New User
                </h3>
                <button class="modal-close" onclick="closeAddUserModal()">×</button>
            </div>
            <form id="addUserForm" class="modal-body">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-input" placeholder="Enter full name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Registration Number</label>
                    <input type="text" name="registration_number" class="form-input" placeholder="Enter reg number" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="user@example.com" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select" required>
                            <option value="">Select Role</option>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Department</label>
                        <select name="department" class="form-select" required>
                            <option value="">Select Department</option>
                            <option value="CSE">Computer Science</option>
                            <option value="ECE">Electronics</option>
                            <option value="MECH">Mechanical</option>
                            <option value="CIVIL">Civil</option>
                            <option value="EEE">Electrical</option>
                            <option value="IT">Information Technology</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Enter password" required>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">
                        <span>✓</span> Add User
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeAddUserModal()">
                        <span>✕</span> Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
            <span class="theme-icon" aria-hidden="true"></span>
        </button>

                align-items: flex-start;

                grid-template-columns: 1fr;
            }

        /* ==========================================================
           RESPONSIVE FIXES - 1920 / 1440 / 1024 / 768 / 480 / 360
           ========================================================== */

        /* Modal: fits any viewport, scrolls internally */
        .modal-content {
            width: min(560px, 100%);
            max-height: min(88vh, calc(100vh - 32px));
            overflow-y: auto;
        }

        /* <=968: universal sidebar goes off-canvas (see universal-sidebar.css);
           release its reserved margin so content spans full width */
        @media (max-width: 968px) {
            .dashboard-main {
                margin-left: 0 !important;
            }
        }

        /* <=900: hero stacks, actions go edge-to-edge */
        @media (max-width: 900px) {
            .hero-content-inline {
                flex-direction: column;
                align-items: stretch;
            }

            .hero-actions {
                width: 100%;
            }

            .hero-actions .btn {
                flex: 1 1 auto;
                justify-content: center;
            }
        }

        /* <=768: type scale, full-width controls, iOS zoom guard */
        @media (max-width: 768px) {
            .page-title {
                font-size: clamp(1.6rem, 7vw, 2rem);
                overflow-wrap: anywhere;
            }

            .page-hero,
            .dashboard-section {
                padding: 1.25rem;
            }

            .filter-input,
            .filter-select,
            .form-input,
            .form-select {
                font-size: 16px;
                line-height: 1.45;
            }

            .filter-row,
            .form-row {
                grid-template-columns: minmax(0, 1fr);
            }

            .modal {
                padding: var(--space-md);
            }

            .modal-header {
                padding: 1.25rem 1.25rem 0.85rem;
            }

            .modal-body {
                padding: 1.25rem;
            }
        }

        /* <=640: wide user table becomes stacked cards - no page-level
           horizontal scroll; action buttons wrap under the row content */
        @media (max-width: 640px) {
            .table-responsive::after {
                content: none;
            }

            .modern-table,
            .modern-table tbody,
            .modern-table tr {
                display: block;
                width: 100%;
                min-width: 0;
                background: transparent;
                border-radius: 0;
                overflow: visible;
            }

            .modern-table thead {
                display: none;
